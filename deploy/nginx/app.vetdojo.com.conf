server {
    listen 80;
    listen [::]:80;
    server_name app.vetdojo.com;

    # Keep this above JOURNAL_PDF_MAX_BYTES (25 MiB) so Django can validate it.
    client_max_body_size 30m;

    location /static/ {
        alias /srv/vetdojo/web_app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/vetdojo/gunicorn.sock;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
